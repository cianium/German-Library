name: Production gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run qa
      - run: npm run qa:studio:browser
      - run: npm run qa:ssr:browser
      - run: npm run build
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_secret
          SITE_URL: https://example.invalid
      - run: npm run verify:dist
